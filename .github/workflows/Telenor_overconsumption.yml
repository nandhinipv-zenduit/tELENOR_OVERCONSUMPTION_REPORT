name: Telenor SIM Usage Audit

# Runs the Telenor overconsumption report daily, and lets you trigger it
# on demand from the Actions tab for testing.
on:
  schedule:
    # 10:00 AM EST (UTC-5) = 15:00 UTC, every day.
    # NOTE: GitHub Actions cron is always UTC and does not observe DST, so
    # during Eastern Daylight Time (UTC-4, roughly Mar-Nov) this fires at
    # 11:00 AM Eastern clock time instead of 10:00 AM. If you need it pinned
    # to 10:00 AM Eastern year-round, swap this single line for two cron
    # entries (one at "0 15 * * *" for EST months, one at "0 14 * * *" for
    # EDT months) — say the word and I'll wire that up.
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Telenor SIM report
        env:
          # Gmail (delivery) — OAuth2 via the Gmail API, not GMAIL_PASS.
          # Same client/refresh token already set up for the 1NCE/FloLive/
          # Monogoto repos (gmail.send scope) — reuse those secret values
          # here, no need to mint a new token.
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # GMAIL_PASS is no longer read — delete that secret once this
          # workflow runs green, so nobody is misled into "fixing" the app
          # password later.

          # Telenor / Aeris (Service Portal login)
          TELENOR_USERNAME: ${{ secrets.TELENOR_USERNAME }}
          TELENOR_PASSWORD: ${{ secrets.TELENOR_PASSWORD }}
          # TELENOR_COMPANY_QUERY is intentionally omitted — the script
          # falls back to "01001566" when it's unset. Only add this line
          # (with a matching secret) if that default is ever wrong for
          # your account.

          # Zoho Analytics (Zenduit device / account data)
          ZOHO_CLIENT_ID_ANALYTICS: ${{ secrets.ZOHO_CLIENT_ID_ANALYTICS }}
          ZOHO_CLIENT_SECRET_ANALYTICS: ${{ secrets.ZOHO_CLIENT_SECRET_ANALYTICS }}
          ZOHO_CLIENT_REFRESH_TOKEN_ANALYTICS: ${{ secrets.ZOHO_CLIENT_REFRESH_TOKEN_ANALYTICS }}
          # ZOHO_ORG_ID, ZOHO_ANALYTICS_DOMAIN, ZOHO_ACCOUNTS_DOMAIN, and
          # ZOHO_ANALYTICS_EXPORT_TIMEOUT_SECONDS are intentionally omitted —
          # the script has working defaults for all of them. Add any of them
          # back here (with a matching secret) only if you ever need to
          # override one.
        run: python main.py
