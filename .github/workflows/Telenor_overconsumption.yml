name: Telenor SIM Usage Audit

# Runs the Telenor overconsumption report on a monthly schedule, and lets
# you trigger it on demand from the Actions tab for testing.
on:
  schedule:
    # 06:00 UTC on the 1st of every month. Adjust to taste — cron is UTC,
    # so shift for your local time zone if it matters.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Telenor SIM report
        env:
          # Gmail (delivery)
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}

          # Telenor / Aeris (Service Portal login)
          TELENOR_USERNAME: ${{ secrets.TELENOR_USERNAME }}
          TELENOR_PASSWORD: ${{ secrets.TELENOR_PASSWORD }}
          # Optional override — defaults to "01001566" in the script if unset.
          TELENOR_COMPANY_QUERY: ${{ secrets.TELENOR_COMPANY_QUERY }}

          # Zoho Analytics (Zenduit device / account data)
          ZOHO_CLIENT_ID_ANALYTICS: ${{ secrets.ZOHO_CLIENT_ID_ANALYTICS }}
          ZOHO_CLIENT_SECRET_ANALYTICS: ${{ secrets.ZOHO_CLIENT_SECRET_ANALYTICS }}
          ZOHO_CLIENT_REFRESH_TOKEN_ANALYTICS: ${{ secrets.ZOHO_CLIENT_REFRESH_TOKEN_ANALYTICS }}
          # Optional overrides — the script has defaults for all of these.
          ZOHO_ORG_ID: ${{ secrets.ZOHO_ORG_ID }}
          ZOHO_ANALYTICS_DOMAIN: ${{ secrets.ZOHO_ANALYTICS_DOMAIN }}
          ZOHO_ACCOUNTS_DOMAIN: ${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
          ZOHO_ANALYTICS_EXPORT_TIMEOUT_SECONDS: ${{ secrets.ZOHO_ANALYTICS_EXPORT_TIMEOUT_SECONDS }}
        run: python telenor_sim_report.py
